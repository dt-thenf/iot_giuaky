name: Build LuaLaTeX study PDFs

on:
  push:
    branches: [main]
    paths:
      - 'main.tex'
      - 'preamble.tex'
      - 'hardware_macros.tex'
      - 'hardware_only.tex'
      - 'latex/**'
      - 'chapters/**'
      - '.github/workflows/build-pdf.yml'
  pull_request:
    branches: [main]
    paths:
      - 'main.tex'
      - 'preamble.tex'
      - 'hardware_macros.tex'
      - 'hardware_only.tex'
      - 'latex/**'
      - 'chapters/**'
      - '.github/workflows/build-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaLaTeX and Vietnamese fonts
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            texlive-luatex texlive-latex-extra texlive-lang-european texlive-lang-other \
            texlive-pictures texlive-fonts-recommended latexmk \
            fonts-noto-core fonts-dejavu-core
      - name: Compile Chapter 1, Chapter 2 and master
        run: |
          set -euo pipefail
          latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build main.tex
          latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build hardware_only.tex
          for i in 01 02; do
            latexmk -lualatex -interaction=nonstopmode -halt-on-error -outdir=build chapters/standalone_${i}.tex
          done
          mkdir -p pdf
          rm -f pdf/iot_tong_hop_3_chuong.pdf pdf/iot_tong_hop_6_chuong.pdf pdf/iot_hardware_3_chuong.pdf
          rm -f pdf/chuong_03.pdf pdf/chuong_04.pdf pdf/chuong_05.pdf pdf/chuong_06.pdf
          cp build/main.pdf pdf/iot_tong_hop_2_chuong.pdf
          cp build/hardware_only.pdf pdf/iot_hardware_chuong_02.pdf
          for i in 01 02; do
            cp build/standalone_${i}.pdf pdf/chuong_${i}.pdf
          done
      - name: Commit generated PDFs
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A pdf/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: rebuild PDFs according to original Chapter 1 and Chapter 2'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: iot-lualatex-pdf
          path: pdf/*.pdf